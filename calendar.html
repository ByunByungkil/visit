<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가을대심방 예약 캘린더 | 도초동부성결교회</title>
<meta name="description" content="2026년 도초동부성결교회 가을대심방 실시간 예약 현황">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="hero">
  <div class="container">
    <p class="subtitle">실시간 예약 현황</p>
    <h1>가을대심방 캘린더</h1>
    <p>10월 19일(월) ~ 24일(토)</p>
  </div>
</header>

<!-- CALENDAR PAGE -->
<section class="page">
  <div class="container">
    <div class="calendar-header">
      <div>
        <h2>예약 현황</h2>
        <div id="calendarStatus" style="margin-top:8px;"></div>
      </div>
      <div class="calendar-controls">
        <button id="calendarRefresh">새로고침</button>
        <a href="index.html" style="display:inline-block;padding:8px 12px;background:#c85a3a;color:#fff;text-decoration:none;border-radius:4px;font-size:13px;font-weight:600;border:none;cursor:pointer;">신청하기</a>
      </div>
    </div>

    <div id="calendarLoading" style="display:none;text-align:center;padding:40px;color:#5a4a42;">
      <div class="loading"></div>
      <p style="margin-top:12px;font-size:13px;">데이터를 불러오는 중입니다...</p>
    </div>

    <div class="calendar-grid" id="calendarGrid">
      <!-- 동적으로 생성됨 -->
    </div>

    <div style="margin-top:40px;padding:20px;background:#f0ebe3;border-radius:4px;">
      <p style="margin:0;color:#5a4a42;font-size:13px;">
        <strong>📌 예약 안내</strong><br>
        • 이 캘린더는 실시간으로 업데이트됩니다. (30초 간격 자동 갱신)<br>
        • 신청 페이지에서 직접 신청하면 즉시 반영됩니다.<br>
        • 문의사항: 000-0000-0000
      </p>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="container">
    <p class="church-name">도초동부성결교회</p>
    <p><a href="index.html">신청 페이지로 돌아가기</a></p>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
